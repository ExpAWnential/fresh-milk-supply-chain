# Certificates for every company. One peer, one admin and one user each: the user is the identity
# a company signs its business transactions with, and the admin is only used by the network scripts.
#
# The organisations here must match scripts/orgs.sh, configtx/configtx.yaml and the compose files.
PeerOrgs:
  - Name: Regulator
    Domain: regulator.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
    Users:
      Count: 1

  - Name: Farm
    Domain: farm.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
