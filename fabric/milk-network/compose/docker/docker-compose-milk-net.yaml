# Docker-specific overlay: the peer builds chaincode by talking to the host's docker socket, and
# the container it starts has to join the same network as the peers.

# Identical for every peer, so it is written once.
x-peer-docker: &peer-docker
  volumes:
    - ./docker/peercfg:/etc/hyperledger/peercfg
    # Root Compose includes this overlay without exporting DOCKER_SOCK, so use the standard socket
    # unless the host provides a different path.
    - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
  environment:
    - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
    - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_milk

services:

  orderer.example.com:
    volumes:
      - ./docker/peercfg:/etc/hyperledger/peercfg

  peer0.regulator.example.com:
    <<: *peer-docker

  peer0.farm.example.com:
    <<: *peer-docker

  peer0.processor.example.com:
    <<: *peer-docker

  peer0.logistics.example.com:
    <<: *peer-docker

  peer0.retailer.example.com:
    <<: *peer-docker

  peer0.oracle.example.com:
    <<: *peer-docker
