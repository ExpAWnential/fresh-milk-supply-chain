<!doctype html>
<!--
  Browser control panel for registration, batch traceability, cold-chain evidence and integrity
  checks. It talks to each organisation's separate backend, so the selected organisation determines
  which Fabric identity signs a request.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fresh Milk Cold Chain — Demo</title>
    <style>
      :root {
        --ink: #14213d;
        --muted: #5b6b8c;
        --line: #d8dee9;
        --ok: #1b7f4b;
        --refused: #a6600a;
        --broken: #b3261e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1rem 1.25rem 3rem;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #fff;
      }
      h1 { font-size: 1.2rem; margin: 0 0 .75rem; }
      h1 small { font-weight: 400; color: var(--muted); font-size: .8rem; margin-left: .5rem; }
      .bar {
        display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
        padding: .75rem; border: 2px solid var(--ink); border-radius: 8px; margin-bottom: .75rem;
      }
      .bar label { font-weight: 600; }
      select, input, button {
        font: inherit; padding: .4rem .6rem; border: 1px solid var(--line);
        border-radius: 6px; background: #fff; color: inherit;
      }
      select, input { min-width: 9rem; }
      button { cursor: pointer; }
      button:hover { border-color: var(--ink); }
      button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
      /* The chip row shows the health of each organisation's separate backend. */
      #backends { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: 1rem; }
      .chip {
        font-size: .8rem; padding: .25rem .6rem; border-radius: 999px;
        border: 1px solid var(--line); color: var(--muted);
      }
      .chip.up { border-color: var(--ok); color: var(--ok); font-weight: 600; }
      .chip.down { border-color: var(--broken); color: var(--broken); }
      .group { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-bottom: .5rem; }
      .group .name {
        width: 8rem; font-size: .75rem; letter-spacing: .07em; text-transform: uppercase;
        color: var(--muted); font-weight: 700;
      }
      .split { display: grid; grid-template-columns: 1fr 1fr; margin: 1rem 0; }
      .split section { border: 1px solid var(--line); padding: .75rem; min-width: 0; }
      .split section + section { border-left: 0; }
      .split h2 {
        font-size: .75rem; letter-spacing: .07em; text-transform: uppercase;
        margin: 0 0 .5rem; color: var(--muted);
      }
      .split pre { margin: 0; font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; }
      #log { border: 1px solid var(--line); border-radius: 8px; max-height: 24rem; overflow: auto; }
      #log:empty::after {
        content: "Every request and the contract's reply appear here.";
        display: block; padding: .75rem; color: var(--muted);
      }
      .entry { border-bottom: 1px solid var(--line); padding: .55rem .75rem; }
      .entry:last-child { border-bottom: 0; }
      .entry .head { font-weight: 600; font-size: .9rem; }
      .entry pre { margin: .3rem 0 0; font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; }
      .ok .head { color: var(--ok); }
      .refused .head { color: var(--refused); }
      .broken .head { color: var(--broken); }
      code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <h1>
      Fresh Milk Cold Chain
      <small>each company runs its own backend; the port that answered is shown on every line</small>
    </h1>

    <div class="bar">
      <label for="company">Send to</label>
      <select id="company"></select>

      <label for="batch">Batch</label>
      <input id="batch" list="batches" value="BATCH-001" />
      <datalist id="batches">
        <option value="BATCH-001"></option>
        <option value="BATCH-002"></option>
      </datalist>
      <button id="newBatch">new</button>

      <button id="setup" class="primary">Set up demo</button>
      <button id="ping">Ping all</button>
      <button id="clear">Clear log</button>
    </div>

    <div id="backends"></div>

    <div id="actions"></div>

    <div class="split">
      <section>
        <h2>PostgreSQL — the oracle's own record</h2>
        <pre id="offChain">Use "Show evidence" to fill this in.</pre>
      </section>
      <section>
        <h2>Ledger — anchored</h2>
        <pre id="onChain">—</pre>
      </section>
    </div>

    <div id="log"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const companyField = $("company");
      const batchField = $("batch");

      function log(tone, title, body) {
        const entry = document.createElement("div");
        entry.className = `entry ${tone}`;
        const head = document.createElement("div");
        head.className = "head";
        head.textContent = title;
        entry.append(head);
        if (body) {
          const detail = document.createElement("pre");
          detail.textContent = body;
          entry.append(detail);
        }
        $("log").prepend(entry);
      }

      // Contract refusals are business outcomes, so display them separately from system faults.
      function toneFor(status) {
        if (status >= 200 && status < 300) return "ok";
        if (status >= 400 && status < 500) return "refused";
        return "broken";
      }

      // Public keys for the bundled sensors. Regenerating the sensor keys requires updating
      // these values because the backend does not serve files from the oracle package.
      const SENSORS = [
        {
          sensorId: "SENSOR-001",
          publicKey: "MCowBQYDK2VwAyEAuQBUNozc43qvuq0ks7mBu0k9/FERFhM3pxKJNZ1WWsA="
        },
        {
          sensorId: "SENSOR-002",
          publicKey: "MCowBQYDK2VwAyEAdHH5MLcXlIlEbBbdgbwKtVD4ccV1yZaJ+uW/FfE+efY="
        }
      ];

      const SIGNATURE_ISSUES = {
        FORGED: (v) => `NO — reading ${v.signatureFailures.join(", ")} was altered`,
        SENSOR_NOT_REGISTERED: () => "no sensor key registered, so nothing to check against",
        SENSOR_REVOKED: () => "the regulator has revoked this sensor's key",
        MIXED_SENSORS: () => "these readings came from more than one sensor"
      };

      function signatureLine(v) {
        if (v.signaturesMatch === null) return "could not check the ledger";
        if (v.signaturesMatch) return "yes";
        return SIGNATURE_ISSUES[v.signatureIssue]?.(v) ?? "NO";
      }

      let companies = [];
      const originOf = (name) => companies.find((entry) => entry.name === name)?.origin;
      // The destination backend determines which organisation signs the request.
      const portOf = (origin) => {
        try {
          return `:${new URL(origin).port}`;
        } catch {
          return "(no backend)";
        }
      };

      async function call(method, path, { body, origin } = {}) {
        const target = origin ?? companyField.value;
        const company = companies.find((entry) => entry.origin === target);
        const label = `${method} ${portOf(target)}${path}   as ${company?.name ?? "?"}`;

        // Disable actions until the organisation directory supplies their destinations.
        if (!target) {
          log("broken", `${label}   →   no backend selected`,
            `The company directory has not loaded. Press "Ping all", or check that the backend ` +
              `serving this page is running.`);
          return { status: 0, body: null };
        }

        try {
          const response = await fetch(target + path, {
            method,
            headers: body ? { "content-type": "application/json" } : {},
            body: body ? JSON.stringify(body) : undefined
          });
          const text = await response.text();
          let parsed = text;
          try { parsed = JSON.parse(text); } catch { /* keep the raw body */ }

          log(
            toneFor(response.status),
            `${label}   →   ${response.status}`,
            typeof parsed === "string" ? parsed : JSON.stringify(parsed, null, 2)
          );
          return { status: response.status, body: parsed };
        } catch (error) {
          // Network TypeErrors do not identify the failed backend, so include its origin.
          log("broken", `${label}   →   ${target} did not answer`, String(error));
          return { status: 0, body: null };
        }
      }

      // Each backend reports its own certificate because no process holds another company's key.
      async function loadConsortium() {
        try {
          const response = await fetch("/organisations");
          if (!response.ok) {
            throw new Error(`the directory answered ${response.status}`);
          }
          companies = await response.json();
        } catch (error) {
          // Surface directory failure instead of leaving an apparently usable but inert panel.
          log("broken", "Could not load the company directory",
            `${String(error)}\n\nThe backend serving this page is not answering. Check it is ` +
              `running, then reload.`);
          return;
        }

        companyField.innerHTML = companies
          .map((entry) => `<option value="${entry.origin}">${entry.name} — ${portOf(entry.origin)}</option>`)
          .join("");
        const remembered = localStorage.getItem("company");
        companyField.value = companies.some((entry) => entry.origin === remembered)
          ? remembered
          : originOf("farm");

        await pingAll();
      }

      async function pingAll() {
        $("backends").innerHTML = companies
          .map((entry) => `<span class="chip" id="chip-${entry.name}">${entry.name} ${portOf(entry.origin)}</span>`)
          .join("");

        await Promise.all(
          companies.map(async (entry) => {
            const chip = $(`chip-${entry.name}`);
            try {
              const response = await fetch(`${entry.origin}/identity`);
              entry.certificateId = (await response.json()).certificateId;
              chip.className = "chip up";
            } catch {
              entry.certificateId = undefined;
              chip.className = "chip down";
            }
          })
        );
      }

      // Bootstrap the first regulator before using it to register the remaining organisations.
      async function setUpDemo() {
        // Refuse incomplete setup rather than creating only part of the registry.
        const missing = companies.filter((entry) => !entry.certificateId);
        if (missing.length > 0) {
          log(
            "broken",
            "Set up demo   →   not every company answered",
            `No certificate from: ${missing.map((entry) => portOf(entry.origin)).join(", ")}.\n` +
              `All six backends have to be running. Try "Ping all".`
          );
          return;
        }

        const regulator = companies.find((entry) => entry.name === "regulator");
        await call("POST", "/stakeholders/bootstrap", {
          origin: regulator.origin,
          body: { stakeholderId: regulator.stakeholderId }
        });

        // The regulator registers each certificate reported by its owning organisation.
        for (const entry of companies.filter((candidate) => candidate.name !== "regulator")) {
          await call("POST", "/stakeholders", {
            origin: regulator.origin,
            body: {
              stakeholderId: entry.stakeholderId,
              role: entry.name.toUpperCase(),
              certificateId: entry.certificateId
            }
          });
        }

        // Register sensor keys so every organisation can verify readings independently.
        for (const sensor of SENSORS) {
          await call("POST", "/sensors", {
            origin: regulator.origin,
            body: { ...sensor, algorithm: "ed25519" }
          });
        }
      }

      const batch = () => encodeURIComponent(batchField.value);
      const evidence = (id) => encodeURIComponent(id);

      // The oracle lists its off-chain rows. The selected organisation independently verifies
      // those readings against the on-chain fingerprint.
      async function showEvidence() {
        const oracle = originOf("oracle");
        const listed = await call("GET", `/temperature/batches/${batch()}/evidence`, { origin: oracle });
        if (listed.status !== 200 || !Array.isArray(listed.body) || listed.body.length === 0) {
          $("offChain").textContent = "No evidence recorded for this batch yet.";
          $("onChain").textContent = "—";
          return;
        }

        const evidenceId = listed.body[listed.body.length - 1].evidenceId;
        const [readings, verified] = await Promise.all([
          call("GET", `/temperature/evidence/${evidence(evidenceId)}/readings`, { origin: oracle }),
          call("GET", `/temperature/evidence/${evidence(evidenceId)}/verify`)
        ]);

        if (readings.status === 200 && Array.isArray(readings.body)) {
          $("offChain").textContent =
            `${evidenceId}\n\n` +
            readings.body
              .map((r) => `${String(r.celsius).padStart(6)} °C   ${r.recordedAt}   ${r.sensorId}`)
              .join("\n") +
            `\n\n${readings.body.length} readings, held by the oracle`;
        }

        if (verified.status === 200) {
          const v = verified.body;
          const statistics = v.anchoredStatistics;
          const checker = companies.find((entry) => entry.origin === companyField.value);
          $("onChain").textContent =
            `hash        ${v.anchoredHash}\n` +
            `recomputed  ${v.recomputedHash}\n\n` +
            (statistics ? `min ${statistics.minCelsius}   max ${statistics.maxCelsius}\n\n` : "") +
            `readings match anchor     ${v.match ? "yes" : "NO — tampered"}\n` +
            `statistics match anchor   ${v.statisticsMatch === null ? "not recorded" : v.statisticsMatch ? "yes" : "NO"}\n` +
            // Null means signature verification was unavailable. Only FORGED identifies rows
            // because registration and revocation are sensor-level issues.
            `signatures match sensor   ${signatureLine(v)}\n` +
            // Only the oracle can compare Fabric with its own stored hash.
            `holder's own hash         ${v.databaseHashMatchesAnchor === null ? "not disclosed" : v.databaseHashMatchesAnchor ? "matches" : "ALTERED"}\n` +
            `transaction               ${v.fabricTransactionId ?? "—"}\n\n` +
            `checked by ${checker?.name ?? "?"}, readings from the oracle,\n` +
            `sensor key read from the ledger`;
        } else {
          $("onChain").textContent = `Could not verify (${verified.status}).`;
        }
      }

      const regulator = () => ({ origin: originOf("regulator") });

      const actions = [
        ["Stakeholders", [
          ["Look up farm", () => call("GET", "/stakeholders/farm-001")],
          ["Suspend farm", () => call("POST", "/stakeholders/farm-001/suspend", regulator())],
          ["Reactivate farm", () => call("POST", "/stakeholders/farm-001/reactivate", regulator())]
        ]],
        ["Batch", [
          ["Create", () => call("POST", "/batches", {
            body: { batchId: batchField.value, origin: "Green Pastures Dairy", location: "Bega NSW" }
          })],
          ["Process", () => call("POST", `/batches/${batch()}/events`, {
            body: { eventType: "PROCESSING", location: "Bega Processing Plant" }
          })],
          ["Ship", () => call("POST", `/batches/${batch()}/events`, {
            body: { eventType: "TRANSPORT", location: "Hume Highway" }
          })],
          ["Deliver", () => call("POST", `/batches/${batch()}/events`, {
            body: { eventType: "DELIVERY", location: "Sydney Depot" }
          })],
          ["Recall", () => call("POST", `/batches/${batch()}/recall`, {
            ...regulator(), body: { reason: "Investigation opened" }
          })],
          ["Get", () => call("GET", `/batches/${batch()}`)],
          ["History", () => call("GET", `/batches/${batch()}/history`)],
          ["All in transit", () => call("GET", "/batches?status=IN_TRANSIT")]
        ]],
        ["Temperature", [
          ["Show evidence", showEvidence],
          ["Clear breach", () => call("POST", `/temperature/batches/${batch()}/resolve-breach`, {
            ...regulator(), body: { reason: "Cold store repaired and stock rechecked" }
          })],
          // Verdicts come from the regulator's independent archive.
          ["Regulator's archive", () => call("GET", `/verdicts/batches/${batch()}`, regulator())]
        ]],
        ["Consumer", [
          ["Public lookup", () => call("GET", `/public/batches/${batch()}`, { origin: originOf("retailer") })]
        ]]
      ];

      $("actions").innerHTML = actions
        .map(([name, items], group) =>
          `<div class="group"><span class="name">${name}</span>` +
          items
            .map((item, index) => `<button data-group="${group}" data-index="${index}">${item[0]}</button>`)
            .join("") +
          `</div>`
        )
        .join("");

      $("actions").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (button) {
          actions[Number(button.dataset.group)][1][Number(button.dataset.index)][1]();
        }
      });

      // Preserve the selected organisation across a page refresh.
      companyField.addEventListener("change", () =>
        localStorage.setItem("company", companyField.value)
      );
      batchField.addEventListener("change", () => localStorage.setItem("batch", batchField.value));
      batchField.value = localStorage.getItem("batch") ?? "BATCH-001";

      // Use random batch IDs so refused requests do not consume sample evidence IDs.
      $("newBatch").addEventListener("click", () => {
        batchField.value = `BATCH-${Math.floor(1000 + Math.random() * 9000)}`;
        localStorage.setItem("batch", batchField.value);
      });

      $("setup").addEventListener("click", setUpDemo);
      $("ping").addEventListener("click", pingAll);
      $("clear").addEventListener("click", () => { $("log").innerHTML = ""; });

      loadConsortium().catch((error) =>
        log("broken", "The page could not start up", String(error))
      );
    </script>
  </body>
</html>
