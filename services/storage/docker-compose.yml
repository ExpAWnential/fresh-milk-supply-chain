# Named so the volume below is not derived from whatever the directory happens to be called.
name: fresh-milk-storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Two databases, one per company that actually holds off-chain data. This one is created by
      # the entrypoint; the regulator's is created by initdb/02-regulator.sql.
      POSTGRES_DB: freshmilk_oracle
      POSTGRES_USER: freshmilk
      POSTGRES_PASSWORD: freshmilk
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Run in filename order, and ONLY when the data directory is empty. With an existing volume
      # none of this runs and the databases silently stay as they were: use `pnpm db:reset`.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    # Checked over TCP rather than the socket. While the scripts above run, the entrypoint keeps the
    # server on its socket alone, so a socket check would report ready before the databases exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U freshmilk -d freshmilk_oracle"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
