# Pins the Compose project name so the PostgreSQL volume keeps one stable identity.
name: fresh-milk-storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Two databases, one per company that actually holds off-chain data. This one is created by
      # the entrypoint; the regulator's is created by initdb/02-regulator.sql.
      POSTGRES_DB: freshmilk_oracle
      POSTGRES_USER: freshmilk
      POSTGRES_PASSWORD: freshmilk
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL runs these scripts in filename order only when the data directory is empty.
      # Existing volumes retain their current databases and schema.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    # The entrypoint accepts local socket connections while initialisation scripts are still running.
    # Probe TCP so healthy means both application databases are ready for other containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U freshmilk -d freshmilk_oracle"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
